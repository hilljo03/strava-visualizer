<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strava Visualizer</title>
  <style>
    :root {
      --strava: #fc5200;
      --bg: #fbf8f6;
      --bg-accent: #fff1e9;
      --surface: #ffffff;
      --border: #e9e2dc;
      --text: #1a1715;
      --muted: #6f655e;
      --shadow: 0 1px 2px rgba(26, 23, 21, .04), 0 12px 32px -12px rgba(26, 23, 21, .12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14100e;
        --bg-accent: #241610;
        --surface: #1d1815;
        --border: #322a25;
        --text: #f6f2ef;
        --muted: #a79c94;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -12px rgba(0, 0, 0, .6);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, var(--bg-accent), transparent 70%),
        var(--bg);
    }

    /* Decorative route line behind the card. */
    .routes {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      opacity: .5;
      pointer-events: none;
    }

    .routes path {
      fill: none;
      stroke: var(--strava);
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: .18;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 44px 40px 32px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--strava);
      box-shadow: 0 6px 18px -6px rgba(252, 82, 0, .7);
    }

    .connect {
      display: inline-block;
      border-radius: 6px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .connect:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -10px rgba(252, 82, 0, .75); }
    .connect:active { transform: translateY(0); }
    .connect:focus-visible { outline: 2px solid var(--strava); outline-offset: 3px; }

    /* Official asset ships at 237x48; keep that height, shrink only on narrow screens. */
    .connect img { display: block; width: 237px; height: 48px; max-width: 100%; }

    .scopes {
      margin: 22px 0 0;
      font-size: .64rem;
      line-height: 1.5;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      .card { padding: 34px 24px 26px; }
    }
  </style>
</head>
<body>
  <svg class="routes" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M-40 620 C 180 560, 220 420, 400 400 S 640 470, 760 360 S 980 210, 1240 250" />
    <path d="M-40 700 C 220 690, 300 540, 470 520 S 700 590, 840 470 S 1040 330, 1240 380" />
    <path d="M-40 500 C 140 420, 260 330, 420 300 S 620 340, 730 240 S 960 120, 1240 140" />
  </svg>

  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff">
        <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169" />
      </svg>
    </div>

    <a class="connect" href="/login">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="/static/btn_strava_connect_with_white.svg" />
        <img src="/static/btn_strava_connect_with_orange.svg" alt="Connect with Strava" width="237" height="48" />
      </picture>
    </a>

    <p class="scopes">Read-only access to your activities. Nothing is posted on your behalf.</p>
  </main>
</body>
</html>
